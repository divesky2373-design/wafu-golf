<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>和风球场</title>
<style>
  /* 布局：全屏 3D 画面，四角是半透明的墨色面板，中下部留给球和挥杆的手势，什么都不放 */
  :root { color-scheme: dark; --bg: #0d1118; --fg: #fff; --red: #d9432b; --gold: #ffd76a; --sky: #a9e2ff; --warn: #ffb199; --ink: rgba(20, 17, 22, .46); --ink2: rgba(14, 12, 18, .66); --soft: rgba(255, 255, 255, .1); --line: rgba(255, 255, 255, .18);
    --mincho: "Hiragino Mincho ProN", "Songti SC", "Yu Mincho", "Noto Serif CJK SC", "Source Han Serif SC", STSong, SimSun, serif;
    --sans: -apple-system, "PingFang SC", "Hiragino Sans", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px)); --gt: calc(14px + env(safe-area-inset-top, 0px)); --gb: calc(16px + env(safe-area-inset-bottom, 0px)); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--sans);
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; touch-action: none; }
  canvas#gl, canvas#ov { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  canvas#gl { touch-action: none; cursor: crosshair; }
  canvas#ov, #hud { pointer-events: none; }
  #hud { position: fixed; inset: 0; }
  .hide { opacity: 0 !important; pointer-events: none !important; }
  .panel { background: var(--ink); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-left: 3px solid var(--red); border-radius: 2px; }
  button { font: 600 12px var(--sans); color: #f1ece6; background: var(--soft); border: 1px solid var(--line); border-radius: 2px; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  button.on { background: var(--red); border-color: var(--red); color: #fff; }
  button.off { opacity: .32; }
  button.primary { background: var(--red); border-color: var(--red); color: #fff; font: 600 17px var(--mincho); letter-spacing: .3em; padding: 10px 24px 10px 30px; }
  button.primary:hover { filter: brightness(1.12); }
  kbd { font: 600 10px ui-monospace, Menlo, monospace; background: rgba(255, 255, 255, .16); padding: 1px 5px; border-radius: 3px; margin: 0 1px; }
  .warn { color: var(--warn); } .good, .pure { color: var(--gold); } .dim { opacity: .66; }
  :root:not(.touch) .touch-only, :root.touch .mouse-only { display: none; }

  /* 左上：球洞信息；下面是刚打完那一杆的数据（过几秒自己收起） */
  #left { position: absolute; left: var(--gl); top: var(--gt); display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  #info { padding: 11px 16px 11px 15px; max-width: 330px; }
  #info .name { font: 600 24px/1.1 var(--mincho); letter-spacing: .12em; }
  #info .sub { font-size: 12px; opacity: .78; margin-top: 5px; letter-spacing: .05em; }
  #holes { display: flex; gap: 5px; margin-top: 8px; pointer-events: auto; } #holes button { padding: 4px 9px; }
  #status { font-size: 14px; margin-top: 9px; } #status b { color: var(--gold); font-weight: 700; }
  #lietip { font-size: 12px; color: #ffc4b0; margin-top: 4px; line-height: 1.45; } #lietip:empty { display: none; }
  #windrow { margin-top: 7px; font-size: 13px; color: var(--sky); display: flex; align-items: center; gap: 8px; }
  #windArrow { display: inline-block; font-size: 15px; transition: transform .25s; }
  #lastshot { margin-top: 7px; font-size: 12px; pointer-events: auto; cursor: pointer; } #lastshot:empty { display: none; } #lastshot b { color: var(--gold); }
  #shot { width: 318px; max-width: calc(100vw - 32px); box-sizing: border-box; padding: 10px 12px 9px 12px; font-size: 12px; transition: opacity .35s; }
  #shot:empty { display: none; }
  #shot .top { display: flex; align-items: baseline; gap: 10px; }
  #shot .dist { font: 700 32px/1 var(--sans); } #shot .dist small { font-size: 13px; font-weight: 600; opacity: .8; }
  #shot .msg { font-size: 13px; }
  #shot .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 8px 0 7px; }
  #shot .grid div { background: rgba(255, 255, 255, .07); padding: 4px 6px 5px; border-radius: 2px; }
  #shot .grid span { display: block; font-size: 10px; opacity: .66; }
  #shot .grid b { font: 700 15px/1.25 var(--sans); font-variant-numeric: tabular-nums; } #shot .grid i { font: 500 9.5px var(--sans); opacity: .6; margin-left: 2px; font-style: normal; }
  #shot .grid .hl b { color: var(--gold); }
  #shot .foot { margin-top: 3px; font-size: 12px; line-height: 1.5; } #shot .shape { color: var(--sky); }

  /* 右上：球杆、小工具；小地图在右下 */
  #right { position: absolute; right: var(--gr); top: var(--gt); display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
  #clubs { display: grid; grid-template-columns: repeat(8, 34px); gap: 4px; pointer-events: auto; }
  #clubs button { padding: 6px 0; background: var(--ink); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); } #clubs button.on { background: var(--red); }
  #clubsel { display: none; align-items: center; gap: 4px; pointer-events: auto; } #clubsel button { width: 38px; height: 34px; background: var(--ink); } #clubsel b { min-width: 62px; text-align: center; font: 700 15px var(--sans); text-shadow: 0 1px 5px rgba(0, 0, 0, .7); }
  #clubinfo { font-size: 12.5px; text-shadow: 0 1px 5px rgba(0, 0, 0, .7); text-align: right; } #clubinfo b { color: var(--gold); }
  #util { display: flex; gap: 5px; pointer-events: auto; } #util button { padding: 4px 9px; background: var(--ink); font-weight: 500; }
  #mini { position: fixed; right: var(--gr); bottom: var(--gb); width: 150px; height: auto; border: 1px solid rgba(255, 255, 255, .22); border-radius: 2px; box-shadow: 0 6px 24px rgba(0, 0, 0, .35); opacity: .93; }

  /* 左下：杆面、弹道、瞄准——键盘能调的，这里都能点 */
  #dock { position: absolute; left: var(--gl); bottom: var(--gb); display: flex; flex-direction: column; gap: 6px; }
  #dock .grp { padding: 7px 9px 7px 8px; display: flex; flex-direction: column; gap: 5px; pointer-events: auto; transition: opacity .3s; }
  body:not([data-st="ready"]) #dock .grp { opacity: 0; pointer-events: none; }
  .st { display: grid; grid-template-columns: 30px 40px 56px 40px 30px; align-items: center; gap: 5px; font-size: 12.5px; }
  .st .lab { opacity: .75; } .st b { text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; } .st b.set { color: var(--gold); }
  .st button { height: 28px; padding: 0; font-size: 10px; } .st kbd, #dock .row kbd { background: none; opacity: .5; padding: 0; }
  body[data-putt="1"] .st.shotonly { opacity: .3; pointer-events: none; }
  #dock .row { display: flex; gap: 5px; } #dock .row button { flex: 1; height: 28px; white-space: nowrap; } #dock .row kbd { margin-left: 5px; }

  body[data-st="menu"] #left, body[data-st="menu"] #right, body[data-st="load"] #left, body[data-st="load"] #right { visibility: hidden; }
  #hint { width: 318px; max-width: calc(100vw - 32px); box-sizing: border-box; padding: 9px 12px; border-left-color: var(--gold); }
  #hint.hide { display: none; }
  #hint .l1 { font-size: 13.5px; font-weight: 600; line-height: 1.5; } #hint .l2 { font-size: 12px; opacity: .88; margin-top: 5px; line-height: 1.55; }
  #banner { position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%) scale(.92); text-align: center; opacity: 0; transition: opacity .25s, transform .35s; text-shadow: 0 2px 18px rgba(0, 0, 0, .55); white-space: nowrap; }
  #banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #banner .big { font: 600 clamp(30px, 6vw, 58px)/1 var(--mincho); letter-spacing: .14em; color: var(--gold); }
  #banner .small { font-size: 17px; margin-top: 10px; letter-spacing: .1em; }
  #title { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); text-align: center; transition: opacity 1.2s; text-shadow: 0 2px 26px rgba(0, 0, 0, .5); }
  #title .jp { white-space: nowrap; font: 600 clamp(40px, 9vw, 84px)/1 var(--mincho); letter-spacing: .22em; }
  #title .line { width: 120px; height: 3px; background: var(--red); margin: 22px auto 16px; }
  #title .sub2 { font-size: 16px; letter-spacing: .2em; opacity: .92; } #title .skip { font-size: 12px; opacity: .6; margin-top: 18px; letter-spacing: .1em; }

  /* 打完一洞：横贯画面的一条墨带；三洞打完带上成绩卡 */
  #done { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); padding: 26px var(--gr) 24px var(--gl); text-align: center; background: var(--ink2);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; transition: opacity .5s; border-top: 2px solid var(--red); border-bottom: 2px solid var(--red); }
  #done.show { opacity: 1; pointer-events: auto; }
  #done .big { font: 600 clamp(38px, 7vw, 60px)/1 var(--mincho); letter-spacing: .2em; } #done .small { margin-top: 12px; font-size: 15px; letter-spacing: .05em; line-height: 1.5; }
  #done table { margin: 16px auto 0; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  #done th, #done td { padding: 5px 14px; text-align: center; border-bottom: 1px solid var(--line); } #done th { font-weight: 500; opacity: .7; } #done td.nm { font-family: var(--mincho); letter-spacing: .08em; } #done tr.sum td { border-bottom: 0; font-weight: 700; }
  #done .acts { margin-top: 18px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; } #done .acts button:not(.primary) { padding: 0 16px; font-size: 13px; }

  /* 开始页：标题和玩法压在左边一条暗下去的幕上，右边留给球场 */
  #menu { position: absolute; inset: 0; display: flex; pointer-events: auto; overflow: auto; touch-action: pan-y; transition: opacity .6s;
    background: linear-gradient(90deg, rgba(10, 9, 14, .88) 0%, rgba(10, 9, 14, .66) 36%, rgba(10, 9, 14, 0) 72%); }
  #menu .card { margin: auto 0 auto clamp(20px, 7vw, 110px); max-width: 440px; padding: 24px 0; }      /* 上下用 auto：放得下就居中，放不下就从头排、可以滚 */
  #menu h1 { font: 600 clamp(44px, 7.5vw, 84px)/1.05 var(--mincho); letter-spacing: .16em; margin: 0; white-space: nowrap; }
  #menu .rule { width: 84px; height: 3px; background: var(--red); margin: 20px 0 16px; }
  #menu .lead { font-size: 16px; letter-spacing: .12em; opacity: .92; margin: 0 0 22px; }
  #menu .how { display: flex; align-items: center; gap: 14px; margin: 0 0 14px; }
  #menu .gest { width: 104px; flex: none; overflow: visible; }
  .gest .guide { stroke: rgba(255, 255, 255, .28); stroke-width: 2; stroke-dasharray: 3 5; } .gest .ball { fill: #fff; } .gest .ring { fill: none; stroke: rgba(255, 255, 255, .5); stroke-width: 1.5; }
  .gest .arr { fill: none; stroke: rgba(255, 255, 255, .7); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; } .gest .arr.fast { stroke: var(--red); stroke-width: 3; }
  .gest text { fill: rgba(255, 255, 255, .85); font: 600 15px var(--mincho); } .gest text.fast { fill: var(--gold); }
  .gest .cur { fill: rgba(255, 215, 106, .95); stroke: rgba(0, 0, 0, .35); animation: gest 3.4s linear infinite; }
  @keyframes gest { 0% { transform: translate(98px, 14px); opacity: 0; } 8% { opacity: 1; } 18%, 27% { transform: translate(65px, 40px); } 63%, 69% { transform: translate(65px, 138px); } 77% { transform: translate(65px, 8px); opacity: 1; } 90%, 100% { transform: translate(65px, 8px); opacity: 0; } }
  #menu ol { margin: 0; padding: 0; list-style: none; counter-reset: st; display: grid; gap: 9px; font-size: 13.5px; line-height: 1.45; }
  #menu ol li { counter-increment: st; display: grid; grid-template-columns: 22px auto 1fr; column-gap: 8px; align-items: baseline; opacity: .92; }
  #menu ol li::before { content: counter(st); font: 600 15px var(--mincho); color: var(--red); }
  #menu ol b { font: 600 16px var(--mincho); color: var(--gold); letter-spacing: .12em; white-space: nowrap; }
  #menu .note { font-size: 13px; opacity: .8; margin: 0 0 20px; line-height: 1.6; }
  #alt { padding: 8px 12px; font-weight: 500; font-size: 13px; }
  #menu .acts { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; font-size: 13px; } #bestline { opacity: .85; } #bestline b { color: var(--gold); }
  #menu .fine { font-size: 12px; opacity: .6; margin: 18px 0 0; line-height: 1.7; }
  /* 新手教学的卡片：浮在画面上方正中，球和挥杆的地方留空 */
  #tut { position: absolute; left: 50%; transform: translateX(-50%); top: 21%; width: min(500px, calc(100% - 32px)); box-sizing: border-box; padding: 11px 16px 12px 15px; border-left-color: var(--gold); pointer-events: auto; transition: opacity .3s; }
  #tut .steps { display: flex; align-items: center; gap: 6px; font-size: 11.5px; opacity: .8; } #tut .steps i { width: 20px; height: 3px; background: rgba(255, 255, 255, .25); } #tut .steps i.on { background: var(--gold); } #tut .steps i.done { background: var(--red); } #tut .steps span { margin-left: 4px; }
  #tut .ttl { font: 600 20px/1.3 var(--mincho); letter-spacing: .08em; margin-top: 6px; }
  #tut .goal { font-size: 13.5px; line-height: 1.6; margin-top: 4px; opacity: .95; } #tut .goal:empty { display: none; } #tut .goal ul { margin: 2px 0 0; padding-left: 1.15em; } #tut .goal li { margin: 3px 0; } #tut .goal li b { color: var(--gold); }
  #tut .now { font-size: 15.5px; font-weight: 700; color: var(--gold); margin-top: 7px; min-height: 1.45em; } #tut .now:empty { display: none; }
  #tut .fb { font-size: 13px; line-height: 1.55; color: var(--sky); margin-top: 3px; } #tut .fb:empty { display: none; }
  #tut .acts { display: flex; gap: 8px; margin-top: 9px; align-items: center; } #tut .acts button:not(.primary) { padding: 4px 10px; font-weight: 500; opacity: .85; } #tut .acts .primary { font-size: 15px; padding: 7px 18px 7px 22px; }
  body[data-tut="1"] #left, body[data-tut="1"] #right, body[data-tut="1"] #dock .grp { visibility: hidden; }
  body[data-tut="tour"] #dock .grp, body[data-tut="tour"] #clubs, body[data-tut="tour"] #clubsel, body[data-tut="tour"] #info, body[data-tut="tour"] #mini { outline: 2px solid var(--gold); outline-offset: 2px; animation: pulse 1s ease-in-out infinite alternate; }
  body[data-tut="tour"] #hint, body[data-tut="tour"] #shot { display: none; }
  @keyframes pulse { from { outline-color: rgba(255, 215, 106, .2); } to { outline-color: rgba(255, 215, 106, 1); } }
  [hidden] { display: none !important; }
  /* 教练的提示：每条前面一个小标签 */
  #hint .now { font-size: 13.5px; font-weight: 700; color: var(--gold); margin-top: 5px; min-height: 1.45em; } #hint button { pointer-events: auto; margin-top: 5px; padding: 4px 10px; font-weight: 500; }
  #hint .cl { font-size: 12.5px; line-height: 1.55; } #hint .cl + .cl { margin-top: 5px; } #hint .cl b { display: inline-block; font: 600 11px var(--sans); color: #1b1612; background: var(--gold); border-radius: 2px; padding: 0 5px; margin-right: 6px; line-height: 1.5; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 var(--gr) 0 var(--gl); background: var(--bg); font: 600 20px/1.8 var(--mincho); letter-spacing: .3em; transition: opacity .4s; }
  #err { position: fixed; left: 12px; bottom: 12px; right: 12px; color: var(--warn); font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; pointer-events: none; }

  /* 窄屏和手机：面板收紧，球杆换成左右切换 */
  @media (max-width: 760px), (max-height: 540px) {
    #info { max-width: min(230px, 49vw); box-sizing: border-box; padding: 8px 11px 8px 10px; } #util button { padding: 4px 6px; font-size: 11px; } #util { gap: 4px; } #info .name { font-size: 18px; } #info .sub, #holes, #windrow .dim { display: none; }
    #status { font-size: 12.5px; margin-top: 6px; } #windrow { font-size: 12px; margin-top: 4px; } #lietip, #lastshot { font-size: 11px; }
    #clubs, .st kbd, #dock .row kbd { display: none; } #clubsel { display: flex; } #clubinfo { font-size: 11.5px; max-width: 40vw; }
    #mini { width: 92px; } #hint { width: min(230px, 49vw); padding: 7px 10px; } #hint .l1 { font-size: 12.5px; } #hint .l2 { font-size: 11.5px; }
    .st { grid-template-columns: 30px 40px 54px 40px; } .st button { height: 32px; } #dock .row button { height: 32px; }
    #menu ol { font-size: 12.5px; } #menu .lead { font-size: 14px; } #hint .cl { font-size: 11.5px; } #tut .ttl { font-size: 17px; } #tut .goal { font-size: 12.5px; } #tut .now { font-size: 14px; }
  }
  /* 矮屏幕：开始页收紧，保证一屏放得下 */
  @media (max-height: 540px) {
    #menu { background: linear-gradient(90deg, rgba(10, 9, 14, .9) 0%, rgba(10, 9, 14, .8) 62%, rgba(10, 9, 14, .25) 100%); }
    #menu .card { max-width: 600px; padding: 12px 0; } #menu h1 { font-size: 40px; } #menu .rule { margin: 10px 0 9px; } #menu .lead { margin-bottom: 10px; }
    #menu .how { margin-bottom: 8px; } #menu .gest { width: 78px; } #menu ol { gap: 4px; } #menu .note { margin-bottom: 10px; font-size: 12px; } #menu .fine { margin-top: 9px; } button.primary { padding: 7px 20px 7px 26px; font-size: 15px; }
  }
  /* 横着拿的手机：屏幕矮，左上的几块面板改成横排，免得和左下角的调节面板叠在一起 */
  @media (max-height: 540px) and (orientation: landscape) { #left { flex-direction: row; } #shot { width: 300px; } #tut { left: 252px; transform: none; top: var(--gt); width: min(400px, calc(100% - 252px - 176px)); padding: 8px 12px; } body[data-tut="1"] #tut { left: 50%; transform: translateX(-50%); width: min(460px, calc(100% - 32px)); } }
  @media (max-width: 760px) and (orientation: portrait) {
    #dock { display: contents; }
    #dock .grp { position: absolute; bottom: var(--gb); padding: 6px 7px 6px 6px; } #dockL { left: var(--gl); } #dockR { right: var(--gr); }
    .st { grid-template-columns: 46px 46px; grid-template-areas: "lab val" "dec inc"; row-gap: 3px; } .st .lab { grid-area: lab; } .st b { grid-area: val; text-align: right; font-size: 12px; }
    .st button { height: 38px; font-size: 12px; } .st .dec { grid-area: dec; } .st .inc { grid-area: inc; }
    #dock .row button { height: 36px; padding: 0; }
    #mini { position: static; width: 84px; } body:not([data-tut="1"]) #tut { top: max(21%, 216px); }
    #menu { background: linear-gradient(0deg, rgba(10, 9, 14, .92) 0%, rgba(10, 9, 14, .74) 58%, rgba(10, 9, 14, 0) 100%); }
    #menu .card { margin: auto var(--gr) 0 var(--gl); padding: 24px 0 calc(26px + env(safe-area-inset-bottom, 0px)); max-width: none; }
    #done th, #done td { padding: 5px 7px; font-size: 12.5px; }
  }
  @media (prefers-reduced-motion: reduce) { #banner, #title, #menu, #done, #loading { transition: none; } .gest .cur { animation: none; transform: translate(65px, 138px); } }
</style>

</head>
<body data-st="load">
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="hud">
  <div id="left">
    <div id="info" class="panel">
      <div class="name" id="hname"></div>
      <div class="sub" id="subtitle"></div>
      <div id="holes"></div>
      <div id="status"></div>
      <div id="lietip"></div>
      <div id="windrow"><span id="windArrow">↑</span><span id="windTxt"></span><span class="dim">花瓣飘的方向就是风向</span></div>
      <div id="lastshot"></div>
    </div>
    <div id="hint" class="panel hide"></div>
    <div id="shot" class="panel hide"></div>
  </div>
  <div id="right">
    <div id="clubs"></div>
    <div id="clubsel"><button id="cprev" aria-label="换长一号的杆">◀</button><b id="cname"></b><button id="cnext" aria-label="换短一号的杆">▶</button></div>
    <div id="clubinfo"></div>
    <div id="util"><button id="bhelp">玩法</button><button id="bcoach">提示 开</button><button id="bmute">声音 开</button><button id="bfull">全屏</button></div>
    <canvas id="mini" width="300"></canvas>
  </div>
  <div id="dock">
    <div class="grp panel" id="dockL">
      <div class="st shotonly"><span class="lab">杆面</span><button class="dec" data-cmd="arrowleft" aria-label="杆面关一度">◀ 关</button><b id="vface">正</b><button class="inc" data-cmd="arrowright" aria-label="杆面开一度">开 ▶</button><kbd>← →</kbd></div>
      <div class="st shotonly"><span class="lab">弹道</span><button class="dec" data-cmd="arrowdown" aria-label="压低弹道">▼ 低</button><b id="vtraj">标准</b><button class="inc" data-cmd="arrowup" aria-label="打高弹道">高 ▲</button><kbd>↑ ↓</kbd></div>
    </div>
    <div class="grp panel" id="dockR">
