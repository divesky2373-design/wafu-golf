<style>
  /* 布局：全屏 3D 画面，四角是半透明的墨色面板，中下部留给球和挥杆的手势，什么都不放 */

  [hidden] { display: none !important; }
  /* 教练的提示：每条前面一个小标签 */
  #hint .now { font-size: 13.5px; font-weight: 700; color: var(--gold); margin-top: 5px; min-height: 1.45em; } #hint button { pointer-events: auto; margin-top: 5px; padding: 4px 10px; font-weight: 500; }
  #hint .cl { font-size: 12.5px; line-height: 1.55; } #hint .cl + .cl { margin-top: 5px; } #hint .cl b { display: inline-block; font: 600 11px var(--sans); color: #1b1612; background: var(--gold); border-radius: 2px; padding: 0 5px; margin-right: 6px; line-height: 1.5; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 var(--gr) 0 var(--gl); background: var(--bg); font: 600 20px/1.8 var(--mincho); letter-spacing: .3em; transition: opacity .4s; }
  #err { position: fixed; left: 12px; bottom: 12px; right: 12px; color: var(--warn); font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; pointer-events: none; }

  /* 英文：拉丁字母不需要那么大的字距，按钮上的词比汉字长 */
  :root[lang="en"] #menu h1 { letter-spacing: .1em; text-transform: uppercase; font-size: clamp(38px, 6.4vw, 74px); }
  :root[lang="en"] #info .name, :root[lang="en"] #title .jp { letter-spacing: .12em; }
  :root[lang="en"] #banner .big, :root[lang="en"] #done .big { letter-spacing: .08em; } :root[lang="en"] #banner .small, :root[lang="en"] #title .sub2 { letter-spacing: .04em; }
  :root[lang="en"] button.primary { letter-spacing: .08em; padding-left: 24px; } :root[lang="en"] #menu ol b { letter-spacing: .02em; font-size: 15px; } :root[lang="en"] #menu .lead { letter-spacing: .03em; }
  :root[lang="en"] #tut .ttl { letter-spacing: .02em; } :root[lang="en"] #loading { letter-spacing: .12em; } :root[lang="en"] .gest text { font-size: 13px; }
  :root[lang="en"] .st { grid-template-columns: 40px 48px 66px 48px 30px; } :root[lang="en"] .st b { font-size: 11.5px; } :root[lang="en"] .st button { font-size: 10.5px; }
  :root[lang="en"] #menu ol li { grid-template-columns: 22px 1fr; row-gap: 0; } :root[lang="en"] #menu ol li b, :root[lang="en"] #menu ol li .d { grid-column: 2; }
  /* 窄屏和手机：面板收紧，球杆换成左右切换 */
  @media (max-width: 760px), (max-height: 540px) {
    #info { max-width: min(230px, 49vw); box-sizing: border-box; padding: 8px 11px 8px 10px; } #util button { padding: 4px 6px; font-size: 11px; } #util { gap: 4px; } #info .name { font-size: 18px; } #info .sub, #windrow .dim { display: none; } #holes { margin-top: 5px; } #holes button { padding: 3px 7px; font-size: 11.5px; } #util { max-width: calc(100vw - min(230px, 49vw) - 46px); }
    #status { font-size: 12.5px; margin-top: 6px; } #windrow { font-size: 12px; margin-top: 4px; } #lietip, #lastshot { font-size: 11px; }
    #clubs, .st kbd, #dock .row kbd { display: none; } #clubsel { display: flex; } #clubinfo { font-size: 11.5px; max-width: 40vw; }
    #mini { max-width: 92px; max-height: 34vh; } #hint { width: min(230px, 49vw); padding: 7px 10px; } #hint .l1 { font-size: 12.5px; } #hint .l2 { font-size: 11.5px; }
    .st { grid-template-columns: 30px 40px 54px 40px; } .st button { height: 32px; } #dock .row button { height: 32px; } :root[lang="en"] .st { grid-template-columns: 40px 48px 62px 48px; }
    #menu ol { font-size: 12.5px; } #menu .lead { font-size: 14px; } #hint .cl { font-size: 11.5px; } #tut .ttl { font-size: 17px; } #tut .goal { font-size: 12.5px; } #tut .now { font-size: 14px; }
  }
  /* 矮屏幕：开始页收紧，保证一屏放得下 */
  @media (max-height: 540px) {
    #menu { background: linear-gradient(90deg, rgba(10, 9, 14, .9) 0%, rgba(10, 9, 14, .8) 62%, rgba(10, 9, 14, .25) 100%); }
    #menu .card { max-width: 600px; padding: 12px 0; } #menu h1 { font-size: 40px; } #menu .rule { margin: 10px 0 9px; } #menu .lead { margin-bottom: 10px; }
    #menu .how { margin-bottom: 8px; } #menu .gest { width: 78px; } #menu ol { gap: 4px; } #menu .note { margin-bottom: 10px; font-size: 12px; } #menu .fine { margin-top: 9px; } button.primary { padding: 7px 20px 7px 26px; font-size: 15px; }
  }
  /* 横着拿的手机：屏幕矮，左上的几块面板改成横排，免得和左下角的调节面板叠在一起 */
  @media (max-height: 540px) and (orientation: landscape) { #left { flex-direction: row; } #shot { width: 300px; } #tut { left: 252px; transform: none; top: var(--gt); width: min(400px, calc(100% - 252px - 176px)); padding: 8px 12px; } body[data-tut="1"] #tut { left: 50%; transform: translateX(-50%); width: min(460px, calc(100% - 32px)); } }
  @media (max-width: 760px) and (orientation: portrait) {
    #dock { display: contents; }
    #dock .grp { position: absolute; bottom: var(--gb); padding: 6px 7px 6px 6px; } #dockL { left: var(--gl); } #dockR { right: var(--gr); }
    .st, :root[lang="en"] .st { grid-template-columns: 46px 46px; grid-template-areas: "lab val" "dec inc"; row-gap: 3px; } :root[lang="en"] .st { grid-template-columns: 50px 50px; } :root[lang="en"] .st b { font-size: 11px; } .st .lab { grid-area: lab; } .st b { grid-area: val; text-align: right; font-size: 12px; }
    .st button { height: 38px; font-size: 12px; } .st .dec { grid-area: dec; } .st .inc { grid-area: inc; }
    #dock .row button { height: 36px; padding: 0; }
    #mini { position: static; max-width: 84px; max-height: 26vh; } body:not([data-tut="1"]) #tut { top: max(21%, 216px); }
    #menu { background: linear-gradient(0deg, rgba(10, 9, 14, .92) 0%, rgba(10, 9, 14, .74) 58%, rgba(10, 9, 14, 0) 100%); }
    #menu .card { margin: auto var(--gr) 0 var(--gl); padding: 24px 0 calc(26px + env(safe-area-inset-bottom, 0px)); max-width: none; }
    #done th, #done td { padding: 5px 7px; font-size: 12.5px; }
  }
  @media (prefers-reduced-motion: reduce) { #banner, #title, #menu, #done, #loading { transition: none; } .gest .cur { animation: none; transform: translate(65px, 138px); } }
</style>

</head>
<body data-st="load">
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="hud">
  <div id="left">
    <div id="info" class="panel">
      <div class="name" id="hname"></div>
      <div class="sub" id="subtitle"></div>
      <div id="holes"><button id="bhole"></button></div>
      <div id="status"></div>
      <div id="lietip"></div>
      <div id="windrow"><span id="windArrow">↑</span><span id="windTxt"></span><span class="dim">花瓣飘的方向就是风向</span></div>
      <div id="lastshot"></div>
    </div>
    <div id="hint" class="panel hide"></div>
    <div id="shot" class="panel hide"></div>
  </div>
  <div id="right">
    <div id="clubs"></div>
    <div id="clubsel"><button id="cprev" aria-label="换长一号的杆">◀</button><b id="cname"></b><button id="cnext" aria-label="换短一号的杆">▶</button></div>
    <div id="clubinfo"></div>
    <div id="util"><button id="bhelp">玩法</button><button id="bcoach">提示 开</button><button id="bmute">声音 开</button><button id="bfull">全屏</button><button id="blang">EN</button></div>
    <canvas id="mini" width="300"></canvas>
  </div>
  <div id="dock">
    <div class="grp panel" id="dockL">
      <div class="st shotonly"><span class="lab">杆面</span><button class="dec" data-cmd="arrowleft" aria-label="杆面关一度">◀ 关</button><b id="vface">正</b><button class="inc" data-cmd="arrowright" aria-label="杆面开一度">开 ▶</button><kbd>← →</kbd></div>
      <div class="st shotonly"><span class="lab">弹道</span><button class="dec" data-cmd="arrowdown" aria-label="压低弹道">▼ 低</button><b id="vtraj">标准</b><button class="inc" data-cmd="arrowup" aria-label="打高弹道">高 ▲</button><kbd>↑ ↓</kbd></div>
    </div>
    <div class="grp panel" id="dockR">
      <div class="st"><span class="lab">瞄准</span><button class="dec" data-cmd="q" aria-label="往左瞄">◀ 左</button><b id="vaim">正</b><button class="inc" data-cmd="e" aria-label="往右瞄">右 ▶</button><kbd>Q E</kbd></div>
      <div class="row"><button id="bpeek">俯瞰<kbd>V</kbd></button><button data-cmd="r">复位<kbd>R</kbd></button></div>
    </div>
  </div>
  <div id="banner"></div>
  <div id="title" class="hide"><div class="jp" id="tname"></div><div class="line"></div><div class="sub2" id="tsub"></div><div class="skip"><span class="mouse-only">点击</span><span class="touch-only">点一下</span>跳过</div></div>
  <div id="done"></div>
  <div id="picker" class="hide"><div class="pk panel"><div class="ph"><b id="pktitle"></b><span id="pksum"></span><button id="pkx" aria-label="关闭">✕</button></div><div id="pkcourse" class="courses"></div><div id="pkgrid"></div><div id="pkcard"></div><div class="acts"><button id="pkboard"></button><button id="pknew"></button></div></div></div>
  <div id="board" class="hide"><div class="pk panel"><div class="ph"><b id="lbtitle"></b><span id="lbsum"></span><button id="lbx" aria-label="关闭">✕</button></div><div id="lbcourse" class="courses"></div><div id="lbrange" class="tabs"></div><div id="lblist"></div><div class="lbfoot"><label for="lbname" id="lbnamel"></label><input id="lbname" class="nm" maxlength="16" autocomplete="off" spellcheck="false"><span id="lbnote"></span></div></div></div>
  <div id="tut" class="panel hide">
    <div class="steps" id="tutsteps"></div>
    <div class="ttl" id="tuttitle"></div>
    <div class="goal" id="tutgoal"></div>
    <div class="now" id="tutnow"></div>
    <div class="fb" id="tutfb"></div>
    <div class="acts"><button id="tutok" class="primary" hidden>明白了，开球</button><button id="tutskip">跳过教学</button></div>
  </div>
  <div id="menu" class="hide">
    <div class="card">
      <h1>和风球场</h1>
      <div class="rule"></div>
      <p class="lead">两座球场，各十八洞、标准杆 72，杆数越少越好。</p>
      <div id="courses" class="courses"></div>
      <div class="how">
        <svg class="gest" viewBox="0 0 130 170" aria-hidden="true">
          <line class="guide" x1="65" y1="52" x2="65" y2="140"></line>
          <path class="arr" d="M82 70 V118 M76 110 L82 118 L88 110"></path>
          <path class="arr fast" d="M48 118 V58 M42 66 L48 58 L54 66"></path>
          <circle class="ring" cx="65" cy="40" r="15"></circle>
          <circle class="ball" cx="65" cy="40" r="8"></circle>
          <circle class="cur" r="7"></circle>
          <text x="95" y="98">慢</text><text class="fast" x="24" y="92">快</text>
        </svg>
        <ol>
          <li><b>移到球上</b><span class="d"><span class="mouse-only">光标停在白球上，不用点击</span><span class="touch-only">手指按住白球</span></span></li>
          <li><b>慢慢下拉</b><span class="d">大约一秒</span></li>
          <li><b>快速上甩</b><span class="d">甩过球；越快打得越远</span></li>
        </ol>
      </div>
      <p class="note">上了果岭会自动换成推杆。别的都可以先不管，教练会边打边提醒。</p>
      <div class="acts"><button id="start" class="primary">开始</button><button id="alt">跳过教学，直接开球</button><button id="mboard">排行榜</button><button id="mlang">English</button><span id="bestline"></span></div>
      <p class="fine">有声音。<span class="mouse-only">键盘：← → 杆面，↑ ↓ 弹道，Q E 或滚轮转方向，Z X 换杆，按住 V 俯瞰全洞。</span><span class="touch-only">瞄准、弹道、杆面在屏幕下方两角。</span></p>
    </div>
  </div>
</div>
<div id="loading">正在铺设球场…</div>
<div id="err"></div>
<script>
  addEventListener('error', e => { document.getElementById('err').textContent += (e.message || e.error) + '\n'; });
  addEventListener('unhandledrejection', e => { document.getElementById('err').textContent += (e.reason && e.reason.stack || e.reason) + '\n'; });
</script>
